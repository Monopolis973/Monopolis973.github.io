<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spencer Hill</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="config.js"></script>
  <script src="js/shell.js"></script>
  <!-- opentype.js — no integrity attr, SRI hash mismatches block the script silently -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"
          crossorigin="anonymous"></script>
  <script src="js/proof-writer.js"></script>
</head>
<body>

<div class="site-content">
  <!-- nav injected by shell.js -->

  <div class="home-hero">
    <h1>Spencer Hill</h1>
    <p class="tagline">writings, poems, projects, and a few friends.</p>
  </div>

  <div class="home-sections" id="home-cards">
    <!-- populated by script below -->
  </div>

  <div style="max-width:780px;margin:3rem auto 0;padding:0 2rem 4rem;">
    <hr class="chalk-rule">
    <p style="color:var(--chalk-dim);font-family:var(--hand);font-size:1.1rem;">
      This is my little corner of the internet. Pull up a chair.
    </p>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const cards = [
    { label: "writings",  href: "writings.html",  desc: "essays, notes, and longer thoughts" },
    { label: "poetry",    href: "poetry.html",    desc: "poems I've written" },
    // { label: "projects",  href: "projects.html",  desc: "things I've built and made" },
    { label: "friends",   href: "friends.html",   desc: "people whose work I love" },
    { label: "about me",  href: "about.html",     desc: "who I am, roughly" },
  ];
  const container = document.getElementById("home-cards");
  for (const c of cards) {
    container.insertAdjacentHTML("beforeend", `
      <a class="home-card" href="${c.href}">
        <span class="card-label">${c.label}</span>
        <span class="card-desc">${c.desc}</span>
      </a>
    `);
  }
});
</script>

<script src="js/chalkboard.js"></script>
<script>
// ── Proof fetching ─────────────────────────────────────────────────────────

function parseFrontMatter(raw) {
  let title = "", body = raw.trim();
  if (raw.startsWith("---")) {
    const end = raw.indexOf("---", 3);
    if (end !== -1) {
      const block = raw.slice(3, end).trim();
      body = raw.slice(end + 3).trim();
      for (const line of block.split("\n")) {
        const colon = line.indexOf(":");
        if (colon === -1) continue;
        const key = line.slice(0, colon).trim();
        const val = line.slice(colon + 1).trim().replace(/^["']|["']$/g, "");
        if (key === "title") title = val;
      }
    }
  }
  return { title, body };
}

async function fetchRandomProof() {
  const { github_username, github_repo } = SITE_CONFIG;
  try {
    const res   = await fetch(`https://api.github.com/repos/${github_username}/${github_repo}/contents/proofs`);
    if (!res.ok) return null;
    const all   = await res.json();
    const files = all.filter(f => f.name.endsWith(".md") && f.type === "file");
    if (!files.length) return null;
    const chosen = files[Math.floor(Math.random() * files.length)];
    const raw    = await fetch(chosen.download_url).then(r => r.text());
    return parseFrontMatter(raw);
  } catch {
    return null;
  }
}

// ── drawOnLoad fires every visit, after the saved canvas is painted.
// The empty-spot detection in ProofWriter.animate reads pixel data to find
// clear space, so it must run after the existing canvas state is restored.
document.addEventListener("DOMContentLoaded", () => {

  window.drawOnLoad(async function (ctx, canvas) {

    if (typeof opentype === "undefined") {
      console.warn("ProofWriter: opentype.js did not load.");
      return;
    }

    let fontBuffer;
    try {
      const res = await fetch("fonts/Caveat-Regular.ttf");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      fontBuffer = await res.arrayBuffer();
    } catch (e) {
      console.warn("ProofWriter: could not load fonts/Caveat-Regular.ttf —", e.message);
      return;
    }

    const proof = await fetchRandomProof();
    if (!proof) return;

    // animate() returns false if no empty spot was found — we just skip silently.
    const wrote = await ProofWriter.animate(ctx, canvas, proof, fontBuffer);
    if (wrote) window._saveCanvas && window._saveCanvas();
  });

});
</script>
</body>
</html>
