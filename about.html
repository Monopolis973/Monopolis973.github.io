<script src="js/chalkboard.js"></script>
<script>
window.drawInitialMarkings(function(ctx, canvas) {
  ctx.save();

  // Bracket decorating the corner
  ctx.strokeStyle = "rgba(240,236,224,0.13)";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";

  // Top-left bracket
  ctx.beginPath();
  ctx.moveTo(18, 40); ctx.lineTo(18, 18); ctx.lineTo(42, 18);
  ctx.stroke();

  // Bottom-right bracket
  ctx.beginPath();
  ctx.moveTo(canvas.width - 18, canvas.height - 40);
  ctx.lineTo(canvas.width - 18, canvas.height - 18);
  ctx.lineTo(canvas.width - 42, canvas.height - 18);
  ctx.stroke();

  ctx.restore();
});
</script>
