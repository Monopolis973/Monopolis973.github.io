  a script block here that checks window.location.search for the post filename.

  <script>
  window.drawInitialMarkings(function(ctx, canvas) {
    const file = new URLSearchParams(window.location.search).get("file");
    if (file === "my-special-post.md") {
      // draw a red circle around something
      ctx.strokeStyle = "rgba(212,96,96,0.6)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
